name: sensora
description: "Sensora — Offline Mobile Sensor Laboratory"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Existing Team Dependencies
  cupertino_icons: ^1.0.8
  sensors_plus: ^7.1.1
  fl_chart: ^1.3.0
  get: ^4.7.3
  flutter_rotation_sensor:
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  proximity_sensor: ^2.0.0
  light: ^5.0.0

  # Added for High-Performance Drift Database & Sensor Logging
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  # Added for generating Drift database companion files (.g.dart)
  drift_dev: ^2.18.0
  build_runner: ^2.4.8

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true